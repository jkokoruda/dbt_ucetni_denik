name: 'vcfo_dbt_scripts'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Keep exact (upper-case) table names so the Keboola output mapping matches
quoting:
  database: true
  schema: true
  identifier: true

# One repo, six Keboola dbt transformations - each selects its own tag.
# Cross-step tables are sources (input mapping), so a tag never rebuilds another step.
#   create tables   -> dbt run  --select tag:create_tables
#   seed tables     -> dbt seed --select tag:seed_tables
#   normalize UD    -> dbt run  --select tag:normalize_ud
#   initiate STG    -> dbt run  --select tag:initiate_stg
#   aggregate STG   -> dbt run  --select tag:aggregate_stg
#   RPT             -> dbt run  --select tag:rpt
models:
  vcfo_dbt_scripts:
    +materialized: table
    setup:
      +tags: ['create_tables']
    staging:
      +tags: ['normalize_ud']
    initiate:
      +tags: ['initiate_stg']
    marts:
      +tags: ['aggregate_stg']
    reporting:
      +tags: ['rpt']

seeds:
  vcfo_dbt_scripts:
    +quote_columns: true
